name: Refresh

# Weekdays after the US close: refresh daily market bars and macro series, then
# push the staged datasets back to Drive. SEC financial refreshes are not run
# here (SEC has rejected requests from GitHub-hosted runners).
on:
  schedule:
    - cron: "30 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carina-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARINA_DATA: ${{ github.workspace }}/data
      CARINA_DECISIONS: ${{ github.workspace }}/data/decisions
      DRIVE_PROJECT_FOLDER_ID: ${{ vars.CARINA_DRIVE_FOLDER_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Download decisions and staged datasets
        run: |
          mkdir -p "$CARINA_DATA"
          carina drive download decisions --local-root "$CARINA_DATA" --allowed-root decisions
          carina sync pull company
          carina sync pull macro

      - name: Refresh macro series
        # A failed source keeps the others; the job is marked failed at the end.
        run: carina macro refresh || echo "MACRO_FAILED=1" >> "$GITHUB_ENV"

      - name: Refresh market data
        # Exit status 2 means the refresh stopped for review; nothing is promoted.
        run: carina refresh market

      - name: Verify
        run: |
          carina verify
          carina macro verify

      - name: Push staged datasets
        run: |
          carina sync push macro
          carina sync push company

      - name: Report macro source failures
        if: env.MACRO_FAILED == '1'
        run: |
          echo "::error::One or more macro sources failed; see the Refresh macro series step."
          exit 1
